# Young Buddha Web Server Configuration

# Server settings
DEFAULT_PORT=8080
SERVER_BINARY="./zig-out/bin/young-buddha-web"

# Log settings
LOG_FILE="server.log"
ERROR_LOG_FILE="error.log"
PID_FILE="server.pid"
MAX_LOG_SIZE="10M"

# Process settings
STARTUP_WAIT=3
SHUTDOWN_WAIT=2
FORCE_KILL_WAIT=1

# Build settings
BUILD_COMMAND="zig build"
DEBUG_BUILD_COMMAND="zig build -Doptimize=Debug"