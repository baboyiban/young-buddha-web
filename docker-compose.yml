# Base docker-compose file for common service definitions
# Use docker-compose.dev.yml for development
# Use docker-compose.prod.yml for production

services:
  backend:
    platform: linux/amd64
    build:
      context: ./backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - backend-data:/app/data

  frontend:
    platform: linux/amd64
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  cargo-cache:
  target-cache:
  backend-data:
