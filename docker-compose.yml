services:
  backend:
    platform: linux/amd64
    image: chl11wq12/young-buddha-backend:v0.1.0
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - RUSTFLAGS=-C target-cpu=native
    container_name: young-buddha-backend
    env_file:
      - backend/.env
    environment:
      - NODE_ENV=production
      - RUST_LOG=info
    volumes:
      - backend-data:/app/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    platform: linux/amd64
    image: chl11wq12/young-buddha-frontend:v0.1.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://backend:8080
    container_name: young-buddha-frontend
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - frontend/.env.local
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8080
      - BACKEND_ORIGIN=http://backend:8080
    ports:
      - "3000:3000"
    restart: unless-stopped
