services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: young-buddha-backend
    env_file:
      - .env
    volumes:
      - backend-data:/app/data
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: young-buddha-frontend
    depends_on:
      - backend
    env_file:
      - .env.local
    ports:
      - "3000:3000"

volumes:
  backend-data:
    driver: local
