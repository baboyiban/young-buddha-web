services:
  backend:
    platform: linux/amd64
    image: chl11wq12/young-buddha-backend:v0.1.0
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - RUSTFLAGS=-C target-cpu=native
    container_name: young-buddha-backend
    env_file:
      - backend/.env
    environment:
      - NODE_ENV=production
      - RUST_LOG=info
    volumes:
      - backend-data:/app/data
    ports:
      - "8080:8080"
    networks:
      - young-buddha-network
    restart: unless-stopped

  frontend:
    platform: linux/amd64
    image: chl11wq12/young-buddha-frontend:v0.1.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://backend:8080
    container_name: young-buddha-frontend
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - frontend/.env.local
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8080
      - BACKEND_ORIGIN=http://backend:8080
    ports:
      - "3000:3000"
    networks:
      - young-buddha-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/api/v1/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  backend-data:

networks:
  young-buddha-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"
