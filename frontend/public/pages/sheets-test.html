<div class="container">
  <h2>Google Sheets 테스트</h2>
  <form id="sheets-test-form">
    <input name="spreadsheetId" placeholder="스프레드시트 ID" required />
    <input name="gid" placeholder="시트 ID (GID) - 선택사항" />
    <input name="range" placeholder="범위 (예: A1:K100) - 선택사항" />
    <input name="query" placeholder="쿼리 (예: select A, B, C where D = '완료')" required />
    <button type="submit">데이터 조회</button>
  </form>
  <div id="loading" style="display: none; margin: 20px 0; text-align: center;">
    <p>조회 중...</p>
  </div>
  <div id="result" style="margin-top: 20px; display: none;">
    <h3>조회 결과:</h3>
    <pre id="result-data" style="background: #f5f5f5; padding: 15px; border-radius: 5px; overflow-x: auto;"></pre>
  </div>
  <div id="error" style="margin-top: 20px; display: none; color: red;">
    <h3>오류 발생:</h3>
    <pre id="error-message" style="background: #ffe6e6; padding: 15px; border-radius: 5px;"></pre>
  </div>
</div>
<script type="module" src="/pages/sheets-test.ts"></script>
