[test]
# DOM 환경을 설정합니다. "happy-dom"은 jsdom보다 빠릅니다.
# 참고: https://bun.sh/docs/test/dom
dom = "happy-dom"

# 각 테스트 파일이 실행되기 전에 로드할 스크립트 목록입니다.
# 참고: https://bun.sh/docs/test/configuration#preload
preload = ["./src/test/setup.ts"]

# 테스트 파일의 루트 디렉토리를 설정합니다.
# 기본값은 "."이며, 프로젝트 루트에 있는 모든 테스트 파일을 찾습니다.
# src 디렉토리로 제한하면 테스트 실행 속도를 높일 수 있습니다.
# root = "./src"
